# Model evaluation (test bed G4, G5): a candidate model against the serving baseline, then approval, then a
# notification to every project that uses the baseline. Platform team only; run by hand.
#
#   evaluate ─► approve ─► notify
#
#   evaluate   in the platform evaluation project (projects/platform-eval): one probe agent per model through the
#              gateway, same pack and judge; verdict = floors, hard stops, no regression (margin), budget (reported)
#   approve    GitHub environment model-approval: add required reviewers (Settings > Environments) so a named person
#              approves; the requester can't approve their own run when "Prevent self-review" is on
#   notify     an issue per project that lists the baseline, with a due date
# The judge: the pack's judge_model, else the repository variable EVAL_JUDGE_MODEL (default gpt-5.1).
name: model-evaluation

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Evaluation pack in platform/model-evals/ (file name without .yaml)"
        default: gpt-5.4-mini
        required: true
      due_days:
        description: "Days the projects get for their own evaluation"
        default: "14"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: model-evaluation-${{ inputs.pack }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: agent-dev
    env:
      FOUNDRY_ACCOUNT: ${{ vars.FOUNDRY_ACCOUNT }}
      APIM_NAME: ${{ vars.APIM_NAME }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'gpt-5.1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Evaluate candidate against baseline
        run: python scripts/model_eval.py run platform/model-evals/${{ inputs.pack }}.yaml
      - name: Keep the evaluation record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-${{ inputs.pack }}
          path: .pipeline/model-eval.json
          if-no-files-found: ignore
          include-hidden-files: true   # .pipeline/ is a hidden folder: upload-artifact skips those by default

  approve:
    needs: evaluate
    runs-on: ubuntu-latest
    environment: model-approval
    steps:
      - run: |
          echo "### Approved: ${{ inputs.pack }} (environment model-approval; requested by ${{ github.actor }}, run ${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'gpt-5.1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: model-eval-${{ inputs.pack }}
          path: .pipeline
        continue-on-error: true
      - name: Open an issue per project that uses the baseline
        run: python scripts/model_eval.py notify platform/model-evals/${{ inputs.pack }}.yaml ${{ inputs.due_days }}
